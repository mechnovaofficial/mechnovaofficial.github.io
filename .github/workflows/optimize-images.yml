name: Optimize MechNova Images

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "mechnova.css"
      - "theme-unified.css"
      - "promo-codes-2026.html"
      - "about.html"
      - "affiliate.html"
      - "contact.html"
      - "editorial-policy.html"
      - "privacy-policy.html"
      - "terms-and-disclaimer.html"
      - "404.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-images:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install Pillow
        run: python -m pip install --upgrade Pillow
      - name: Resize and compress referenced images
        run: python scripts/optimize_images.py
