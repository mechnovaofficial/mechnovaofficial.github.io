name: Optimize MechNova Images

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - "scripts/optimize_images.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-images:
    # Run for human image/script changes only. The optimizer's own image commit is already optimized.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install Pillow
        run: python -m pip install --upgrade Pillow
      - name: Resize and compress referenced images
        run: python scripts/optimize_images.py
